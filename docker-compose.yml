services:
  app:
    build: .
    command: gunicorn --config gunicorn.conf.py predictions.wsgi:application
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - static_files:/app/srv
      - media_files:/app/media
