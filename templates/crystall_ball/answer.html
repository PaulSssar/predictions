  {% block content %}
    <div class="answer-page">

      <div class="ask-more answer-content">
      <p>
        <img src="{% static 'img/answer.jpg' %}" width="300" height="450" style="border-radius: 10px;">
      </p>
      <p>Вопрос: {{ question.text }}</p>
      <div class="card-container">
        {% for card in cards %}
          <div class="card-item" style="width: 300px; background-color: #ffffff; display: inline-block;">
            <img class="question" src="{{ card.image.url }}">
            <p class="cards center">{{ card.name }}</p>
          </div>
        {% endfor %}
      </div>
      {% if error %}
        <p class="text-danger">{{ error }}</p>
      {% else %}
        <div class="answer-text">{{ answer|render_markdown }}</div>
